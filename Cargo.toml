[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The program's own code is built for size (the upgrade budget is fixed); its dependencies keep opt-level 3.
[profile.release.package.heirloom]
opt-level = "z"
